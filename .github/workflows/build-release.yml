name: Build Releases

on:
  push:
    paths:
      - '.github/workflows/build-release.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - i686-pc-windows-msvc

    env:
      # 静态链接 CRT，确保 Win7 下无需额外 VS Redistributable
      RUSTFLAGS: "-C target-feature=+crt-static"
      RUST_BACKTRACE: full

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # 如果需要从 GitHub 仓库直接使用 traitobject 的修复分支：
      - name: Apply traitobject patch (via patch.crates-io)
        run: |
          cat >> Cargo.toml << 'EOF'

          [patch.crates-io]
          traitobject = { git = "https://github.com/japaric/traitobject", rev = "REVISED_COMMIT_HASH" }
          EOF

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          override: true
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc

      - name: Update proc-macro2 dependency
        run: cargo update -p proc-macro2

      - name: Build for ${{ matrix.target }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: target/${{ matrix.target }}/release/*
          prerelease: ${{ contains(github.ref, '-') }}
